# Julkaisu: kun repositorioon viedään versiotagi (esim. v4.4.0), GitHub
#  1) rakentaa asennettavan oh6kw-jasenrekisteri.zip-tiedoston (kansion nimi aina "oh6kw-jasenrekisteri")
#  2) luo julkaisun (Release), jonka kuvaus otetaan CHANGELOG.md:n vastaavasta osiosta
#  3) vie version WordPress.orgiin (trunk, tags/VERSIO ja assets), jos SVN-tunnukset on asetettu
# Jos julkaisu tehdään käsin GitHubin sivulla, julkaisu luo tagin, ja tämä sama tagiajo liittää zipin siihen.
# (Erillistä release-tapahtumaa ei käytetä: muuten samaan julkaisuun yritettiin ladata zip kahdesti yhtä aikaa.)
name: Julkaisu

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  julkaisu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: PHP-syntaksin tarkistus
        run: |
          for f in $(find . -name '*.php' -not -path './.git/*'); do php -l "$f" > /dev/null || exit 1; done

      - name: Rakenna zip
        # git archive jättää pois .gitattributesin export-ignore-polut (docs, .github)
        run: |
          mkdir -p build
          git archive --format=tar --prefix=oh6kw-jasenrekisteri/ HEAD | tar -x -C build
          cd build && zip -qr ../oh6kw-jasenrekisteri.zip oh6kw-jasenrekisteri

      - name: Luo julkaisu tagista
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSIO="${TAG#v}"
          # Muutosloki: osio "## VERSIO ..." seuraavaan "## "-otsikkoon asti
          awk -v v="$VERSIO" '
            /^## / { if (found) exit; if (index($0, "## " v) == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "**Asennus:** lataa alta \`oh6kw-jasenrekisteri.zip\` ja valitse WordPressissä *Lisäosat → Lisää uusi → Lataa lisäosa*. Aiempi versio korvataan, ja tiedot säilyvät."
          } >> notes.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" oh6kw-jasenrekisteri.zip --clobber
          else
            gh release create "$TAG" oh6kw-jasenrekisteri.zip --title "OH6KW Jäsenrekisteri $VERSIO" --notes-file notes.md --verify-tag --latest
          fi

      - name: Tallenna zip (käsin ajettaessa)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v5
        with:
          name: oh6kw-jasenrekisteri
          path: oh6kw-jasenrekisteri.zip

  wordpress-org:
    # Vienti WordPress.orgin lisäosahakemistoon. Toimii vasta, kun repositorion asetuksiin
    # (Settings → Secrets and variables → Actions) on lisätty SVN_USERNAME ja SVN_PASSWORD.
    needs: julkaisu
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency: wordpress-org
    steps:
      - uses: actions/checkout@v5

      - name: Asenna Subversion
        # Uusimmissa GitHubin Ubuntu-koneissa ei ole svn-komentoa valmiina
        run: sudo apt-get update -qq && sudo apt-get install -y -qq subversion

      - name: Tarkista tunnukset ja versio
        id: check
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSIO="${TAG#v}"
          echo "versio=$VERSIO" >> "$GITHUB_OUTPUT"
          if [ -z "$SVN_USERNAME" ]; then
            echo "SVN-tunnuksia ei ole asetettu – vienti WordPress.orgiin ohitetaan."
            echo "vie=false" >> "$GITHUB_OUTPUT"
          elif svn ls "https://plugins.svn.wordpress.org/oh6kw-jasenrekisteri/tags/$VERSIO" > /dev/null 2>&1; then
            echo "Versio $VERSIO on jo WordPress.orgissa – ohitetaan."
            echo "vie=false" >> "$GITHUB_OUTPUT"
          else
            echo "vie=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Kokoa assets-kansio
        # WordPress.orgin assets-kansioon vain kuvat ja valmis blueprint.json,
        # ei Playground-esikatselun lähdetiedostoja (build.py, demo-seed.php ...)
        if: steps.check.outputs.vie == 'true'
        run: |
          mkdir -p wporg-assets/blueprints
          cp .wordpress-org/*.png wporg-assets/
          cp .wordpress-org/blueprints/blueprint.json wporg-assets/blueprints/

      - name: Vie WordPress.orgiin
        if: steps.check.outputs.vie == 'true'
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: oh6kw-jasenrekisteri
          VERSION: ${{ steps.check.outputs.versio }}
          ASSETS_DIR: wporg-assets
